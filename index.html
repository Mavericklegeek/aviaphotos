<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviaphotos</title>
<style>
  :root{--bg:#000;--fg:#f2f2f2;--muted:#8a8a8a;--panel:#101010;--line:#262626;--like:#ff3b5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:48px 24px 8px;text-align:center}
  h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:600;letter-spacing:.02em}
  header p{margin:8px 0 0;color:var(--muted);font-size:.95rem}

  #galerie{max-width:1200px;margin:0 auto;padding:24px;display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .vignette{position:relative;border:0;padding:0;cursor:pointer;background:var(--panel);
    border-radius:10px;overflow:hidden;aspect-ratio:1/1}
  .vignette img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9;
    transition:transform .35s ease,opacity .35s ease}
  .vignette:hover img,.vignette:focus-visible img{transform:scale(1.06);opacity:1}
  .vignette:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .infos{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;font-size:.78rem;
    display:flex;justify-content:space-between;gap:8px;color:#ddd;
    background:linear-gradient(transparent,rgba(0,0,0,.85))}
  .infos .c{color:var(--like);white-space:nowrap}
  .message{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;line-height:1.7}

  .lightbox{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.94);
    padding:16px;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .lightbox.ouvert{display:flex;animation:f .2s ease}
  @keyframes f{from{opacity:0}to{opacity:1}}
  .lightbox img{max-width:100%;max-height:68vh;border-radius:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.8)}
  .legende{color:var(--muted);font-size:.9rem;text-align:center;margin:0;line-height:1.5}
  .barre{display:flex;flex-direction:column;align-items:center;gap:8px}
  .rangee{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:8px;background:#161616;color:var(--fg);
    border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:.95rem;
    cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,transform .1s}
  .btn:hover{background:#222;border-color:#3a3a3a}
  .btn:active{transform:scale(.97)}
  .btn.actif{color:var(--like);border-color:var(--like)}
  #compteur{color:var(--muted);font-size:.85rem;min-height:1.2em}
  .fermer{position:absolute;top:16px;right:16px;width:44px;height:44px;padding:0;
    justify-content:center;font-size:1.3rem;line-height:1}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
    padding:0;justify-content:center;font-size:1.2rem}
  .nav.prec{left:12px}.nav.suiv{right:12px}
  @media (max-width:600px){.nav{display:none}}
</style>
</head>
<body>

<header>
  <h1>Aviaphotos</h1>
  <p id="sousTitre">Chargement…</p>
</header>

<main id="galerie"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo agrandie">
  <button class="btn fermer" id="btnFermer" aria-label="Fermer">✕</button>
  <button class="btn nav prec" id="btnPrec" aria-label="Précédente">‹</button>
  <button class="btn nav suiv" id="btnSuiv" aria-label="Suivante">›</button>
  <img id="grandePhoto" src="" alt="">
  <p class="legende" id="legende"></p>
  <div class="barre">
    <div class="rangee">
      <button class="btn" id="btnLike"><span id="coeur">♡</span> <span id="texteLike">J'aime</span></button>
      <a class="btn" id="btnTelecharger" download>⤓ Télécharger</a>
    </div>
    <div id="compteur"></div>
  </div>
</div>

<script src="likes.js"></script>
<script src="photos.js"></script>
</body>
</html>
